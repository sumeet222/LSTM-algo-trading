<!doctype html><meta charset="utf-8"><title>HF20 S5 + S9 diagnostics</title>
<style>body{font:15px system-ui;margin:24px;background:#f6f8fc;color:#182438}select,input{padding:8px;margin:5px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.plot{background:white;min-height:330px}pre{white-space:pre-wrap}table{border-collapse:collapse}td,th{padding:5px;border:1px solid #ccd}#status{font-weight:600}</style>
<script>@@PLOTLY_JS@@</script><h1>HF20 S5 + S9 saved-output diagnostics</h1>
<p id="scope"></p><div id="status"></div><label>Model/fold <select id="run"></select></label><label>Role <select id="role"></select></label><label>Ticker <select id="ticker"></select></label><label>Category <select id="category"><option>ALL</option><option>INTRADAY</option><option>OVERNIGHT</option><option>OPENING</option><option>OLD_MORNING</option></select></label><input type="date" id="first"><input type="date" id="last"><label>Source heatmap <select id="qualityfield"><option value="fallback_fraction">Fallback fraction</option><option value="missing_fraction">Missing-minute flag fraction</option><option value="age_mean">Terminal age (minutes)</option></select></label><label>Rank movement <select id="change"><option value="absolute_change">Absolute</option><option value="signed_change">Signed</option></select></label><button id="update">Update</button><button id="full">Full saved role range</button><details><summary>Metrics, selected checkpoint and rank-stability details</summary><pre id="metrics"></pre></details>
<div class="grid"><div class="plot" id="series"></div><div class="plot" id="calibration"></div><div class="plot" id="loss"></div><div class="plot" id="tails"></div><div class="plot" id="distribution"></div><div class="plot" id="pr"></div></div><div class="grid"><div class="plot" id="training"></div><div class="plot" id="gradients"></div></div><div class="grid"><div class="plot" id="quality"></div><div class="plot" id="movement"></div></div><h2>Actual start inventory</h2><pre id="roster"></pre><pre id="qa-result"></pre>
<script>const D=@@PAYLOAD@@;const $=id=>document.getElementById(id);const keys=Object.keys(D.views);const runs=[...new Set(keys.map(k=>k.split('|')[0]))];
function options(id,a){$(id).replaceChildren(...a.map(v=>new Option(v,v)))}options('run',runs);options('role',['oos','inner_train','inner_validation','refit']);
$('scope').textContent=D.rehearsal?'UNTRAINED ZERO-UPDATE REHEARSAL. No scientific result or actual start is represented.':'Retrospective 2021–2024 research. S5 ranking, MAG absolute endpoint return, EVENT tail probability and QUANTILE distribution have different units. No trading/confirmation claim.';
$('roster').textContent=JSON.stringify(D.roster,null,2);
function line(x,y,name,extra={}){return {x,y,name,mode:'lines+markers',...extra}}
function plot(id,traces,title,extra={}){return Plotly.react(id,traces,{title:{text:title,font:{size:15}},margin:{t:65,r:25,b:60,l:65},...extra},{responsive:true})}
function selected(){return D.views[$('run').value+'|'+$('role').value]}
function refreshTicker(){let v=selected();if(!v)return;options('ticker',[...new Set(v.rows.map(r=>r.ticker))]);$('ticker').value='AAPL';$('first').value=v.rows[0].session_date_et;$('last').value=[...new Set(v.rows.map(r=>r.session_date_et))][Math.min(9,new Set(v.rows.map(r=>r.session_date_et)).size-1)];return update()}
async function update(){let v=selected();if(!v)return;let c=$('category').value;let rows=v.rows.filter(r=>r.ticker===$('ticker').value&&r.session_date_et>=$('first').value&&r.session_date_et<=$('last').value&&(c==='ALL'||c===r.category||(c==='OPENING'&&r.slot==='09:30')||(c==='OLD_MORNING'&&['10:30','11:30'].includes(r.slot))));
$('status').textContent=`${$('run').value} / ${v.role}: full ${v.full_rows} stock rows, ${v.full_origins} origins, ${v.full_sessions} sessions. Visible ${rows.length} rows for one ticker. ${v.role==='oos'?'Full saved OOS range available.':'Trajectory restricted to first ten saved sessions; full-role summaries use every row.'}`;
$('metrics').textContent=JSON.stringify({metrics:v.metrics,rank_stability:v.stability,checkpoint_selection:v.selection},null,2);let x=rows.map(r=>r.origin_id),tr=[];let title='';
if(v.arm==='META-T2R'){for(let [col,name] of [['actual_rank','Later-known true rank'],['prediction_rank','S5 META rank'],['S4_rank','Frozen S4 T2R rank'],['M1_rank','M1 rank']])tr.push(line(x,rows.map(r=>r[col]),name));title='Forecast-origin rankings (1 = best)'}
if(v.arm==='MAG'){tr=[line(x,rows.map(r=>Math.abs(r.return_4h)),'Observed |endpoint log return|'),line(x,rows.map(r=>r.prediction_A),'Predicted magnitude; lower-clamped inverse')];tr.push(line(x,rows.map(r=>r.STOCK_prediction_A),'Prefix stock-level control'),line(x,rows.map(r=>r.VOL_prediction_A),'Trailing-volatility control'));title='Absolute endpoint movement (not intrapath volatility)'}
if(v.arm==='EVENT'){tr=[line(x,rows.map(r=>r.p_ANY),'Predicted ANY-tail probability'),line(x,rows.map(r=>r.event_class===1?0:1),'Observed ANY-tail')];tr.push(line(x,rows.map(r=>r.STOCK_p_ANY),'Prefix stock event prior'));title='Tail probability versus event occurrence'}
if(v.arm==='QUANTILE'){for(let [col,name] of [['quantiles_y_05','5% TG20'],['quantiles_y_50','Median TG20'],['quantiles_y_95','95% TG20'],['TG20','Observed TG20']])tr.push(line(x,rows.map(r=>r[col]),name));for(let [col,name] of [['STOCK_quantiles_y_05','Stock baseline 5%'],['STOCK_quantiles_y_95','Stock baseline 95%']])tr.push(line(x,rows.map(r=>r[col]),name,{line:{dash:'dot'}}));title='Signed TG20 quantiles; pinball optimized in asinh units'}
// Explicit nulls break session/closed-market gaps instead of implying continuous paths.
tr=tr.map(t=>{let xx=[],yy=[],text=[];rows.forEach((r,i)=>{if(i&&(r.session_date_et!==rows[i-1].session_date_et||Date.parse(r.origin_id)-Date.parse(rows[i-1].origin_id)!==3600000)){xx.push(null);yy.push(null);text.push(null)}xx.push(t.x[i]);yy.push(t.y[i]);text.push(r.ticker+'; origin '+r.origin_id+'; exit '+r.exit_end_utc+'; '+r.category+'; '+r.quality+'; fallback '+r.fallback)});return {...t,x:xx,y:yy,text,hovertemplate:'%{text}<br>%{y}<extra>%{fullData.name}</extra>',connectgaps:false}});
await plot('series',tr,title,v.arm==='META-T2R'?{yaxis:{autorange:'reversed',range:[20,1]}}:{});
let bins=v.calibration.bins||[];await plot('calibration',v.arm==='META-T2R'?[{x:['T2R MSE'],y:[v.metrics.optimized_loss],type:'bar',name:'Actual optimized loss'}]:bins.length?[line(bins.map(b=>b.predicted),bins.map(b=>b.observed),'Observed versus forecast'),line(bins.map(b=>b.predicted),bins.map(b=>b.predicted),'Identity')]:[{x:[5,50,95],y:['05','50','95'].map(q=>v.metrics['coverage_'+q]),type:'bar',name:'Empirical coverage'},line([5,50,95],[.05,.5,.95],'Nominal coverage')],v.arm==='META-T2R'?'Full-role T2R transformed MSE; no probability calibration':'Full-role calibration / quantile coverage');
await plot('loss',[line(v.daily.day,v.daily.loss,'Mean same-session proper loss')],'Full-role session loss; task-specific units');
await plot('tails',[{x:v.cohorts.map(r=>r.cohort),y:v.cohorts.map(r=>r.actual_loss_share),type:'bar'}],'Full-role actual optimized-loss shares; cohort families overlap');
await plot('distribution',[{x:rows.map(r=>r.actual_loss),type:'histogram',name:'Actual row loss'}],'Visible trajectory row-loss distribution');
let t=v.training||[];await plot('training',[line(t.map(x=>x.epoch),t.map(x=>x.online),'Online dropout ON'),line(t.map(x=>x.epoch),t.map(x=>x.train_off),'Full inner train OFF'),line(t.map(x=>x.epoch),t.map(x=>x.validation_off),'Full validation OFF')],'Calibration objective and checkpoint selection; different tasks have different units');await plot('gradients',[line(t.map(x=>x.epoch),t.map(x=>x.preclip),'Max preclip'),line(t.map(x=>x.epoch),t.map(x=>x.postclip),'Max postclip')],'Recorded gradient clipping, cap 1');let slots=[...new Set(v.coverage.map(r=>r.slot))].sort(),tickers=v.symbols,qf=$('qualityfield').value;await plot('quality',[{type:'heatmap',x:slots,y:tickers,z:tickers.map(t=>slots.map(s=>v.coverage.find(r=>r.ticker===t&&r.slot===s)?.[qf]??null)),zmin:0,zmax:qf==='age_mean'?undefined:1}],'Full-role retrospective '+qf+'; not a new model input');let mv=(v.movement||[]).filter(r=>r.kind===$('change').value);await plot('movement',mv.length?[...new Set(mv.map(r=>r.relation))].map(rel=>({type:'bar',name:rel,x:mv.filter(r=>r.relation===rel).map(r=>r.value),y:mv.filter(r=>r.relation===rel).map(r=>r.size)})):[{type:'bar',x:v.slot_metrics.map(r=>r.group),y:v.slot_metrics.map(r=>r.optimized_loss)}],mv.length?'Full-role '+$('change').value+'; dependent transitions':'Full-role proper loss by origin slot');let pr=v.calibration.pr;await plot('pr',pr&&pr.recall.length?[line(pr.recall,pr.precision,'ANY precision/recall')]:[line(x,rows.map(r=>r.max_terminal_price_age_minutes??null),'Historical source terminal age')],pr?'Full-role weighted PR curve; AP uses every threshold':'Source age diagnostic; not appended S5 metadata');}
$('run').onchange=refreshTicker;$('role').onchange=refreshTicker;$('update').onclick=update;$('full').onclick=()=>{let v=selected();$('first').value=v.rows[0].session_date_et;$('last').value=v.rows[v.rows.length-1].session_date_et;update()};let query=new URLSearchParams(location.search);if(runs.includes(query.get('view')))$('run').value=query.get('view');if(!query.has('qa'))refreshTicker();
async function qa(){let cases=[];try{for(let run of runs){$('run').value=run;for(let role of ['oos','inner_train','inner_validation','refit']){$('role').value=role;let v=selected();if(!v||!v.rows.length)throw Error('missing role '+run+' '+role);await refreshTicker();for(let id of ['series','calibration','loss','tails','distribution','pr','training','gradients','quality','movement'])if(!$(id).data.length)throw Error('blank '+id);cases.push({run,role,rows:v.full_rows,status:'PASS'})}}$('qa-result').textContent=JSON.stringify({status:'PASS',cases})}catch(e){$('qa-result').textContent=JSON.stringify({status:'FAIL',error:String(e),cases})}}if(query.has('qa'))qa();
</script>
