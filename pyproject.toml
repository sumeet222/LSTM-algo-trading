[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "lstm-market-data"
version = "0.1.0"
description = "Auditable Track A data and synthetic research engineering"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.3,<3.1",
  "pyarrow>=21,<24",
  "exchange-calendars>=4.11,<5",
  "requests>=2.32.5,<3",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.13,<1"]
neural = ["torch==2.10.0"]

[project.scripts]
lstm-data = "lstm_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
